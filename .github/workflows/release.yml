# 자동 배포: v0.3.6 같은 버전 태그를 올리면 GitHub 의 Windows 컴퓨터가
# 테스트 → 설치 파일 만들기 → Releases 에 설치 파일·blockmap·latest.yml 올리기를 한다.
# (설치된 앱은 latest.yml 을 보고 새 버전을 받는다)
# 실패하면 이유를 '::error::' 로 남겨, 로그인하지 않아도 실행 요약에서 보이게 한다.
name: 앱 배포

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 태그와 package.json 버전이 같은지 확인
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$version)이 달라요"
            exit 1
          fi

      - run: npm ci

      - name: 테스트
        run: npm test

      # 올리기는 아래에서 직접 한다 (파일 3개와 설명을 한 번에, 빠진 게 있으면 실패)
      - name: 설치 파일 만들기
        run: npm run desktop:pack

      - name: Releases 에 올리기
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          files=("release/MapleTimer-Setup-$version.exe" "release/MapleTimer-Setup-$version.exe.blockmap" "release/latest.yml")
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::만든 파일이 없어요: $f ($(ls release | tr '\n' ' '))"; exit 1; fi
          done
          note=$(grep -m1 "^$version: " README.md | sed "s/^$version: //" | tr -d '\r' || true)
          {
            echo "설치: 아래 \`MapleTimer-Setup-$version.exe\` 를 받아 실행하세요. 이미 설치했으면 앱이 알아서 바뀌어요."
            if [ -n "$note" ]; then echo; echo "$note"; fi
          } > notes.md
          run() {
            local out code
            out=$("$@" 2>&1); code=$?
            echo "$out"
            if [ $code -ne 0 ]; then echo "::error::$1 $2 $3 실패: $(echo "$out" | tail -n 3 | tr '\r\n' '  ')"; exit $code; fi
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            run gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            run gh release edit "$GITHUB_REF_NAME" --title "메이플 타이머 $version" --notes-file notes.md --draft=false --latest
          else
            run gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "메이플 타이머 $version" --notes-file notes.md --latest
          fi

      - name: 올라간 파일 확인
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tr -d '\r')
          echo "$assets"
          for f in "MapleTimer-Setup-$version.exe" "MapleTimer-Setup-$version.exe.blockmap" latest.yml; do
            echo "$assets" | grep -qx "$f" || { echo "::error::Releases 에 빠진 파일: $f"; exit 1; }
          done
